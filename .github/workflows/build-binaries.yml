name: Build RTL Binaries

# Builds installable Ghostty binaries (Linux + macOS) from this RTL branch
# and attaches them to a GitHub Release. Runs on tag push (e.g. `v1.3.2-rtl.1`)
# or manually via the Actions "Run workflow" button.
#
# These are unsigned/ad-hoc artifacts. Install instructions:
#   Linux:  extract the .tar.gz and place `ghostty` on your PATH
#   macOS:  unzip, then right-click Ghostty.app -> Open (to bypass Gatekeeper)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # On tag push ref_name is like `v1.3.2-rtl.1` (leading `v` stripped by bash).
  # On manual dispatch ref_name is a branch name (not semver), so use a build number.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.{0}', github.run_number) }}

jobs:
  linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Build Ghostty
        run: |
          nix develop -c zig build \
            -Doptimize=ReleaseFast \
            -Dversion-string=${VERSION}

      - name: Verify binary
        run: |
          ./zig-out/bin/ghostty +version

      - name: Package binary
        run: |
          mkdir -p dist/ghostty
          cp zig-out/bin/ghostty dist/ghostty/ghostty
          tar -C dist -czf ghostty-${VERSION}-x86_64-linux.tar.gz ghostty

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostty-linux
          path: ghostty-${VERSION}-x86_64-linux.tar.gz
          if-no-files-found: error

  macos:
    name: Build macOS (universal)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Setup Sparkle
        env:
          SPARKLE_VERSION: 2.9.0
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -L https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip > sparkle.zip
          unzip -q sparkle.zip
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build GhosttyKit (Zig)
        run: |
          nix develop -c zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string=${VERSION}

      # The native app is built with native Xcode tooling. This must NOT run
      # in a Nix environment (Nix breaks xcodebuild). No signing cert, so we
      # disable code signing; the resulting .app is ad-hoc.
      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Update Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "macos/build/Release/Ghostty.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "macos/build/Release/Ghostty.app/Contents/Info.plist"

      - name: Zip app
        run: |
          cd macos/build/Release
          zip -9 -r --symlinks ../../../ghostty-${VERSION}-macos-universal.zip Ghostty.app

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostty-macos
          path: ghostty-${VERSION}-macos-universal.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ github.ref }}
          name: Ghostty RTL ${{ github.ref_name }}
          draft: true
          files: release/*
